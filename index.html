'use strict';const KEY='value-ledger-lite-v2';const $=id=>document.getElementById(id);const uid=()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);const sample={currency:'CAD',initiatives:[{id:'i1',name:'Cloud contact centre migration',owner:'Technology Delivery',sponsor:'VP Operations',date:'2026-12-31',status:'In progress',budget:1200000},{id:'i2',name:'Intelligent call routing',owner:'Contact Centre Operations',sponsor:'VP Customer Experience',date:'2027-03-31',status:'In progress',budget:360000},{id:'i3',name:'Quality and coaching analytics',owner:'Quality Assurance',sponsor:'Director of Service',date:'2027-06-30',status:'Planned',budget:240000}],benefits:[{id:'b1',initiative:'i1',name:'Platform operating cost savings',type:'Financial',unit:'CAD',baseline:0,target:720000,direction:'higher',aggregation:'sum',owner:'Finance',method:'Verified vendor and infrastructure cost reductions',date:'2027-12-31'},{id:'b2',initiative:'i2',name:'Productivity value from routing',type:'Financial',unit:'CAD',baseline:0,target:410000,direction:'higher',aggregation:'sum',owner:'Operations Analytics',method:'Hours released × loaded labour rate; distinguish capacity from cash savings',date:'2027-12-31'},{id:'b3',initiative:'i2',name:'Average handling time',type:'Non-financial',unit:'minutes',baseline:7,target:5,direction:'lower',aggregation:'average',owner:'Contact Centre Operations',method:'Telephony platform average handling time',date:'2027-12-31'},{id:'b4',initiative:'i3',name:'Customer satisfaction',type:'Non-financial',unit:'%',baseline:76,target:85,direction:'higher',aggregation:'average',owner:'Customer Experience',method:'Post-call survey score',date:'2027-12-31'}],tracking:[{id:'t1',benefit:'b1',month:'2026-10',planned:40000,actual:35000,comment:'Vendor consolidation underway'},{id:'t2',benefit:'b1',month:'2026-11',planned:45000,actual:42000,comment:'Contract savings verified'},{id:'t3',benefit:'b1',month:'2026-12',planned:50000,actual:46000,comment:'Migration progressing'},{id:'t4',benefit:'b2',month:'2026-10',planned:18000,actual:14000,comment:'Pilot adoption slower than expected'},{id:'t5',benefit:'b2',month:'2026-11',planned:22000,actual:18000,comment:'Training in progress'},{id:'t6',benefit:'b2',month:'2026-12',planned:26000,actual:24000,comment:'Routing accuracy improved'},{id:'t7',benefit:'b3',month:'2026-10',planned:6.6,actual:6.8,comment:'Baseline optimization'},{id:'t8',benefit:'b3',month:'2026-11',planned:6.3,actual:6.5,comment:'New routing rules deployed'},{id:'t9',benefit:'b3',month:'2026-12',planned:6,actual:6.1,comment:'Progress toward target'},{id:'t10',benefit:'b4',month:'2026-10',planned:78,actual:77,comment:'Survey response volume stable'},{id:'t11',benefit:'b4',month:'2026-11',planned:79,actual:79,comment:'At planned level'},{id:'t12',benefit:'b4',month:'2026-12',planned:80,actual:81,comment:'Coaching improvements'}],costs:[{id:'c1',month:'2026-10',amount:120000},{id:'c2',month:'2026-11',amount:100000},{id:'c3',month:'2026-12',amount:95000}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!valid(state))state=structuredClone(sample);let page='dashboard',mode='quarterly',selected='2026-Q4',entryBenefit='all',benefitSearch='',benefitPage=1,modalKind='',editing='';function valid(x){return x&&Array.isArray(x.initiatives)&&Array.isArray(x.benefits)&&Array.isArray(x.tracking)&&Array.isArray(x.costs)}function normalizeTypes(){state.benefits.forEach(b=>{if(b.type==='Quantitative')b.type='Financial';else if(b.type==='Qualitative')b.type='Non-financial'})}normalizeTypes();function isMonetary(b){return b.type==='Financial'}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){console.warn('Browser storage unavailable',e);return false}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('en-CA',{style:'currency',currency:state.currency||'CAD',maximumFractionDigits:0}).format(Number(n)||0)}function fmt(n){return Number(n||0).toLocaleString('en-CA',{maximumFractionDigits:2})}function period(m){return mode==='monthly'?m:m.slice(0,4)+'-Q'+(Math.floor((Number(m.slice(5,7))-1)/3)+1)}function periods(){let arr=[...new Set([...state.tracking.map(x=>period(x.month)),...state.costs.map(x=>period(x.month))])].sort();return arr.length?arr:[mode==='monthly'?'2026-12':'2026-Q4']}function rowsFor(b,p){return state.tracking.filter(t=>t.benefit===b.id&&period(t.month)===p)}function agg(arr,key,method){if(!arr.length)return null;let vals=arr.map(x=>Number(x[key])||0);return method==='latest'?Number([...arr].sort((a,b)=>a.month.localeCompare(b.month)).at(-1)[key])||0:method==='average'?vals.reduce((a,b)=>a+b,0)/vals.length:vals.reduce((a,b)=>a+b,0)}function metric(b,p){let rows=rowsFor(b,p);if(!rows.length)return null;let plan=agg(rows,'planned',b.aggregation),actual=agg(rows,'actual',b.aggregation);let progress;if(isMonetary(b))progress=plan>0?actual/plan*100:actual>=plan?100:0;else{let delta=plan-b.baseline;progress=Math.abs(delta)<1e-9?(Math.abs(actual-plan)<1e-9?100:0):(actual-b.baseline)/delta*100}let rag=progress>=90?'Green':progress>=70?'Amber':'Red';return {plan,actual,progress,rag,rows}}function financial(p){let planned=0,actual=0;state.benefits.filter(isMonetary).forEach(b=>{let m=metric(b,p);if(m){planned+=m.plan;actual+=m.actual}});return {planned,actual,realization:planned>0?actual/planned*100:null}}function cost(p){return state.costs.filter(x=>period(x.month)===p).reduce((s,x)=>s+(+x.amount||0),0)}function statusHelp(){return `<details class="helpdetails"><summary>ⓘ Status guide: What do the colours mean?</summary><div class="status-guide-list"><div><span class="pill green">Green</span> 90% or more of expected progress, on track.</div><div><span class="pill amber">Amber</span> 70% to under 90%, needs monitoring.</div><div><span class="pill red">Red</span> Below 70%, requires attention.</div><div><span class="pill">Not reported</span> No results entered for the period.</div></div><div class="muted" style="margin-top:10px">Financial benefits use actual ÷ planned; other KPIs measure progress from baseline toward planned value.</div></details>`}function status(r){let descriptions={Green:"Green: 90% or more of expected progress, on track.",Amber:"Amber: 70% to below 90% of expected progress, needs monitoring.",Red:"Red: Below 70% of expected progress, requires attention.","Not reported":"Not reported: No results entered for this reporting period."};let label=r||"Not reported";return `<span class="pill ${label.toLowerCase()} status-tooltip" tabindex="0" title="${esc(descriptions[label]||label)}" aria-label="${esc(descriptions[label]||label)}">${esc(label)}</span>`}function kpi(label,value,note){return `<div class="card"><div class="muted">${label}</div><div class="metric">${value}</div><div class="muted">${note}</div></div>`}function periodPicker(){let pp=periods();if(!pp.includes(selected))selected=pp.at(-1);return `<div class="controls no-print"><label class="field">View<select id="mode"><option value="monthly" ${mode==='monthly'?'selected':''}>Monthly</option><option value="quarterly" ${mode==='quarterly'?'selected':''}>Quarterly</option></select></label><label class="field">Reporting period<select id="selected">${pp.map(p=>`<option ${p===selected?'selected':''}>${esc(p)}</option>`).join('')}</select></label></div>`}function shortMoney(v){let n=Number(v)||0;return Math.abs(n)>=1000000?(n/1000000).toFixed(1)+"M":Math.abs(n)>=1000?(n/1000).toFixed(n%1000?1:0)+"K":String(Math.round(n))}function chart(){let pp=periods(),max=Math.max(1,...pp.flatMap(p=>{let f=financial(p);return [f.planned,f.actual]})),w=720,h=245,margin=45,step=(w-margin-15)/Math.max(1,pp.length),bw=Math.min(26,step*.27);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Planned and actual financial benefits by period"><line x1="${margin}" y1="190" x2="${w-8}" y2="190" stroke="#cbd5e1"/>${pp.map((p,i)=>{let f=financial(p),x=margin+i*step+step/2,y1=190-132*f.planned/max,y2=190-132*f.actual/max;return `<rect x="${x-bw-2}" y="${y1}" width="${bw}" height="${190-y1}" fill="#93c5fd"><title>${esc(p)} planned ${money(f.planned)}</title></rect><rect x="${x+2}" y="${y2}" width="${bw}" height="${190-y2}" fill="#2563eb"><title>${esc(p)} actual ${money(f.actual)}</title></rect><text x="${x-bw/2-2}" y="${Math.max(14,y1-7)}" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a5f">${esc(shortMoney(f.planned))}</text><text x="${x+bw/2+2}" y="${Math.max(14,y2-7)}" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">${esc(shortMoney(f.actual))}</text><text x="${x}" y="224" text-anchor="middle" font-size="11" fill="#475569">${esc(p)}</text>`}).join('')}</svg><div class="legend"><span><i class="dot" style="background:#93c5fd"></i>Planned</span><span><i class="dot" style="background:#2563eb"></i>Actual</span></div>`}function dashboard(){let f=financial(selected),records=state.benefits.map(b=>({b,m:metric(b,selected)})).filter(x=>x.m),risk=records.filter(x=>x.m.rag==='Red').length,green=records.filter(x=>x.m.rag==='Green').length,c=cost(selected);return `<div class="top"><div><h1>Benefits dashboard</h1><p>Monitor committed value, realized outcomes, and delivery risks.</p></div>${periodPicker()}</div><section class="cards">${kpi('Financial realization',f.realization===null?'—':fmt(f.realization)+'%','Actual ÷ planned financial benefits')}${kpi('Benefits on track',green+' / '+records.length,'Green outcomes this period')}${kpi('Benefits at risk',String(risk),'Red outcomes this period')}${kpi('Net financial value',money(f.actual-c),'Actual financial benefits − recorded costs')}</section><div class="grid2"><section class="panel"><h2>Financial benefits: planned vs actual</h2>${chart()}</section><section class="panel"><h2>Benefit health · ${esc(selected)}</h2>${records.length?records.map(({b,m})=>`<div class="briefline"><strong>${esc(b.name)}</strong> ${status(m.rag)}<div class="muted">Planned ${fmt(m.plan)} ${esc(b.unit)} · Actual ${fmt(m.actual)} ${esc(b.unit)}</div></div>`).join(''):'<div class="empty">No benefit records for this period.</div>'}</section></div><section class="panel"><h2>How these figures work</h2><ul class="figures-list"><li><strong>Monthly reporting:</strong> Monthly values are entered once.</li><li><strong>Quarterly reporting:</strong> Financial amounts are summed; non-financial KPIs use each benefit’s selected aggregation method (average, sum, or latest).</li><li><strong>Non-financial status:</strong> Status evaluates progress from baseline toward the period target, including measures where lower is better.</li><li><strong>Financial status:</strong> Status uses actual ÷ planned.</li><li><strong>Missing results:</strong> Only recorded periods are evaluated; missing results are not marked red.</li><li><strong>Program costs:</strong> Actual monthly expenditures are entered and summed for the selected period.</li><li><strong>Net financial value:</strong> This is not ROI or a lifetime forecast.</li></ul></section>`}function initiatives(){return `<div class="top"><div><h1>Initiatives</h1><p>Who owns the work, when is it due, and what is the approved budget?</p></div><button class="btn primary" data-add="initiative">+ Initiative</button></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>Initiative</th><th>Sponsor</th><th>Owner</th><th>Status</th><th>Delivery</th><th>Budget</th><th>Actions</th></tr></thead><tbody>${state.initiatives.map(i=>`<tr><td class="wrap"><strong>${esc(i.name)}</strong></td><td>${esc(i.sponsor)}</td><td>${esc(i.owner)}</td><td>${esc(i.status)}</td><td>${esc(i.date)}</td><td>${money(i.budget)}</td><td><button class="btn" data-edit="initiative:${esc(i.id)}">Edit</button> <button class="btn danger" data-delete="initiative:${esc(i.id)}">Delete</button></td></tr>`).join('')}</tbody></table></div></section><div class="hint">Initiative budgets are reference amounts only. Actual monthly costs are recorded separately under Benefits & tracking to avoid double-counting.</div>`}function benefits(){
if(entryBenefit!=='all'&&!state.benefits.some(b=>b.id===entryBenefit))entryBenefit='all';
let filtered=state.benefits.filter(b=>(entryBenefit==='all'||b.id===entryBenefit)&&(!benefitSearch||[b.name,b.type,b.owner,state.initiatives.find(i=>i.id===b.initiative)?.name].some(x=>String(x||'').toLowerCase().includes(benefitSearch.toLowerCase()))));
const pageSize=8,pages=Math.max(1,Math.ceil(filtered.length/pageSize));benefitPage=Math.min(Math.max(1,benefitPage),pages);
let chosen=filtered.slice((benefitPage-1)*pageSize,benefitPage*pageSize);
let list=chosen.map(b=>{let m=metric(b,selected),initiative=state.initiatives.find(i=>i.id===b.initiative)?.name||'Unassigned';return `<tr><td class="wrap"><strong>${esc(b.name)}</strong><div class="muted">${esc(initiative)}</div></td><td class="wrap">${esc(b.type)}<div class="muted">${esc(b.owner||'—')}</div></td><td class="wrap">${fmt(b.baseline)} → ${fmt(b.target)} ${esc(b.unit)}<div class="muted" title="Measurement method">${esc(b.method||'—')}</div></td><td>${m?fmt(m.plan)+' '+esc(b.unit):'—'}</td><td>${m?fmt(m.actual)+' '+esc(b.unit):'—'}</td><td>${status(m?.rag)}</td><td><div class="actions no-print compact-actions"><button class="btn" title="Edit benefit" aria-label="Edit ${esc(b.name)}" data-edit="benefit:${esc(b.id)}">✎</button><button class="btn" title="Manage monthly results" aria-label="Manage monthly results for ${esc(b.name)}" data-entries="${esc(b.id)}">▦</button><button class="btn danger" title="Delete benefit" aria-label="Delete ${esc(b.name)}" data-delete="benefit:${esc(b.id)}">×</button></div></td></tr>`}).join('');
let costs=state.costs.filter(c=>period(c.month)===selected).sort((a,b)=>a.month.localeCompare(b.month));
return `<div class="top"><div><h1>Benefits & tracking</h1><p>Manage benefit definitions and review performance in one place.</p></div><div class="actions"><button class="btn primary" data-add="benefit">+ Benefit</button><button class="btn" data-add="tracking">+ Monthly result</button><button class="btn" data-add="cost">+ Monthly cost</button></div></div><div class="toolbar">${periodPicker()}</div><section class="panel"><h2>Benefits register & performance · ${esc(selected)}</h2><p class="muted">Planned and actual reflect the selected reporting period. Use the calendar-style button in Actions to manage monthly results for a benefit.</p><div class="benefit-filters no-print"><label class="field">Search benefits<input id="benefitSearch" type="search" placeholder="Search name, initiative, owner…" value="${esc(benefitSearch)}"></label><label class="field">Filter benefits<select id="entryBenefit"><option value="all">All benefits</option>${state.benefits.map(b=>`<option value="${esc(b.id)}" ${entryBenefit===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><span class="muted">${filtered.length} of ${state.benefits.length} benefits</span></div><div class="tablewrap"><table class="benefits-combined"><thead><tr><th>Benefit / Initiative</th><th>Type / Owner</th><th>Baseline / Target</th><th>Planned</th><th>Actual</th><th>Status</th><th>Actions</th></tr></thead><tbody>${list||'<tr><td colspan="7">No matching benefits.</td></tr>'}</tbody></table></div><div class="benefit-pagination no-print"><span class="muted">Showing ${filtered.length?(benefitPage-1)*pageSize+1:0}–${Math.min(benefitPage*pageSize,filtered.length)} of ${filtered.length} benefits</span><div class="actions"><button class="btn" data-benefit-page="prev" ${benefitPage===1?'disabled':''}>Previous</button><span class="muted">Page ${benefitPage} of ${pages}</span><button class="btn" data-benefit-page="next" ${benefitPage===pages?'disabled':''}>Next</button></div></div></section><section class="panel"><h2>Costs · ${esc(selected)}</h2><p class="muted">${mode==='monthly'?'Actual costs recorded for the selected month.':'Total actual costs for the selected quarter, summed from monthly entries. Switch to Monthly to edit individual cost records.'}</p><div class="tablewrap"><table><thead><tr><th>${mode==='monthly'?'Month':'Quarter'}</th><th>Actual cost</th><th>Actions</th></tr></thead><tbody>${mode==='monthly'?(costs.map(c=>`<tr><td>${esc(c.month)}</td><td>${money(c.amount)}</td><td><button class="btn" data-edit="cost:${esc(c.id)}">Edit</button> <button class="btn danger" data-delete="cost:${esc(c.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="3">No costs recorded for this month.</td></tr>'):(costs.length?`<tr><td>${esc(selected)}</td><td><strong>${money(cost(selected))}</strong></td><td><span class="muted">${costs.length} monthly ${costs.length===1?'entry':'entries'}</span></td></tr>`:'<tr><td colspan="3">No costs recorded for this quarter.</td></tr>')}</tbody></table></div><p style="margin-top:12px">Selected period total: <strong>${money(cost(selected))}</strong></p></section><div class="hint">For non-financial outcome KPIs, choose whether higher or lower is better and whether quarterly reporting should average, sum, or use the latest monthly reading. Each benefit should have its own measurement method and owner. Avoid counting workforce capacity as cash savings unless spending is genuinely reduced.</div>`}
function openEntries(id){let b=state.benefits.find(x=>x.id===id);if(!b)return;let rows=state.tracking.filter(x=>x.benefit===id).sort((a,b)=>b.month.localeCompare(a.month));$('modalTitle').textContent='Monthly results · '+b.name;$('form').innerHTML=`<div class="wide"><p class="muted">Review monthly entries for this benefit. Use Add result to record a new month.</p><div class="actions" style="margin:12px 0"><button type="button" class="btn primary" data-add-for="${esc(id)}">+ Add result</button></div><div class="tablewrap"><table><thead><tr><th>Month</th><th>Planned</th><th>Actual</th><th>Commentary</th><th>Actions</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.month)}</td><td>${fmt(t.planned)}</td><td>${fmt(t.actual)}</td><td class="wrap">${esc(t.comment||'—')}</td><td><button type="button" class="btn" data-edit="tracking:${esc(t.id)}">Edit</button> <button type="button" class="btn danger" data-delete="tracking:${esc(t.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No monthly results yet.</td></tr>'}</tbody></table></div></div>`;$('modalbg').classList.add('open');modalKind='entries';editing=id}
function brief(){let f=financial(selected),c=cost(selected),items=state.benefits.map(b=>({b,m:metric(b,selected)})).filter(x=>x.m),risk=items.filter(x=>x.m.rag==='Red');return `<div class="top no-print"><div><h1>Executive brief</h1><p>One-page leadership view of realized outcomes and risks.</p></div><div class="actions">${periodPicker()}<button class="btn primary" id="print">Print / Save PDF</button></div></div><div class="panel brief"><h1>Benefits realization summary</h1><p>Contact Centre Modernization · ${esc(selected)} · Fictional demonstration</p><div class="briefstats" style="margin:16px 0"><div class="briefstat"><span class="muted">Financial realization</span><strong>${f.realization===null?'—':fmt(f.realization)+'%'}</strong><span class="muted summary-explainer">Actual financial benefits as a percentage of planned financial benefits for this period.</span></div><div class="briefstat"><span class="muted">Actual financial benefits</span><strong>${money(f.actual)}</strong><span class="muted summary-explainer">Total financial benefits recorded for the selected period.</span></div><div class="briefstat"><span class="muted">Net financial value</span><strong>${money(f.actual-c)}</strong><span class="muted summary-explainer">Actual financial benefits minus recorded costs for this period.</span></div></div><h2>Benefit performance</h2><div class="tablewrap"><table><thead><tr><th>Benefit</th><th>Planned</th><th>Actual</th><th>Status </th></tr></thead><tbody>${items.map(({b,m})=>`<tr><td class="wrap">${esc(b.name)}</td><td>${fmt(m.plan)} ${esc(b.unit)}</td><td>${fmt(m.actual)} ${esc(b.unit)}</td><td>${status(m.rag)}</td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:18px">Leadership attention</h2>${risk.length?risk.map(({b,m})=>`<div class="briefline"><strong>${esc(b.name)}</strong> ${status(m.rag)}<div class="muted">${esc(m.rows.map(r=>r.comment).filter(Boolean).join(' · ')||'Review root cause and corrective actions.')}</div></div>`).join(''):'<p>No red reported benefits in the selected period.</p>'}<div class="briefline"><strong>Financial context</strong><p>Planned financial benefits: ${money(f.planned)} · Actual program costs: ${money(c)}. Actual financial benefits less recorded costs = ${money(f.actual-c)}.</p></div><p style="margin-top:12px">Based on recorded monthly data only. Missing future periods are not treated as failures. Figures are illustrative and are not audited financial results.</p></div>`}function render(){if(!periods().includes(selected))selected=periods().at(-1);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('app').innerHTML=page==='dashboard'?dashboard():page==='initiatives'?initiatives():page==='benefits'?benefits():brief();if($('mode'))$('mode').onchange=e=>{mode=e.target.value;selected=periods().at(-1);render()};if($('selected'))$('selected').onchange=e=>{selected=e.target.value;render()};if($('entryBenefit'))$('entryBenefit').onchange=e=>{entryBenefit=e.target.value;benefitPage=1;render()};if($('benefitSearch'))$('benefitSearch').onchange=e=>{benefitSearch=e.target.value.trim();benefitPage=1;render()};if($('print'))$('print').onclick=()=>window.print();$('currency').value=state.currency}const field=(name,label,type='text',value='',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;const select=(name,label,options,value)=>`<label class="field">${label}<select name="${name}">${options.map(o=>{let [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`}).join('')}</select></label>`;function openModal(kind,id=''){modalKind=kind;editing=id;let data=({initiative:state.initiatives,benefit:state.benefits,tracking:state.tracking,cost:state.costs}[kind]).find(x=>x.id===id)||{};let html='';if(kind==='initiative')html=field('name','Initiative name','text',data.name||'','required')+field('sponsor','Sponsor','text',data.sponsor||'','required')+field('owner','Benefit owner','text',data.owner||'','required')+select('status','Status',['Planned','In progress','Completed','On hold'],data.status||'Planned')+field('date','Delivery date','date',data.date||'','required')+field('budget','Approved budget (reference only)','number',data.budget??0,'min="0" step="0.01" required');if(kind==='benefit')html=select('initiative','Initiative',state.initiatives.map(i=>[i.id,i.name]),data.initiative||state.initiatives[0]?.id)+field('name','Benefit / KPI name','text',data.name||'','required')+select('type','Benefit type',['Financial','Non-financial'],data.type||'Non-financial')+field('unit','Unit (CAD, %, minutes, etc.)','text',data.unit||'','required')+field('baseline','Baseline','number',data.baseline??0,'step="any" required')+field('target','Overall target','number',data.target??0,'step="any" required')+select('direction','Better when',['higher','lower'],data.direction||'higher')+select('aggregation','Quarterly aggregation',[['sum','Sum of months'],['average','Average of months'],['latest','Latest month']],data.aggregation||'average')+`<div class="wide help"><strong>Quarterly aggregation methods</strong><div><b>Sum:</b> adds all monthly results (e.g., cost savings or call volumes).</div><div><b>Average:</b> takes the simple mean of reported months (e.g., satisfaction % or handling time).</div><div><b>Latest:</b> uses the most recent recorded month (e.g., end-of-quarter KPI snapshot).</div></div>`+field('owner','Benefit owner','text',data.owner||'','required')+field('date','Expected realization date','date',data.date||'','required')+`<label class="field wide">Measurement method<textarea name="method" required>${esc(data.method||'')}</textarea></label>`;if(kind==='tracking')html=select('benefit','Benefit',state.benefits.map(b=>[b.id,b.name]),data.benefit||state.benefits[0]?.id)+field('month','Reporting month','month',data.month||'2026-12','required')+`<div class="wide muted">Choose a month using the calendar icon, or enter YYYY-MM.</div>`+field('planned','Planned value','number',data.planned??0,'step="any" required')+field('actual','Actual value','number',data.actual??0,'step="any" required')+`<label class="field wide">Commentary<textarea name="comment">${esc(data.comment||'')}</textarea></label>`;if(kind==='cost')html=field('month','Cost month','month',data.month||'2026-12','required')+`<div class="wide muted">Choose a month using the calendar icon, or enter YYYY-MM.</div>`+field('amount','Actual cost','number',data.amount??0,'min="0" step="0.01" required');$('modalTitle').textContent=(id?'Edit ':'Add ')+({initiative:'initiative',benefit:'benefit',tracking:'monthly benefit result',cost:'monthly cost'}[kind]);$('form').innerHTML=html+'<div class="actions wide" style="justify-content:flex-end"><button class="btn primary" type="submit">Save</button></div>';$('modalbg').classList.add('open')}function closeModal(){$('modalbg').classList.remove('open')}function showSaveMessage(message){let el=document.getElementById('saveMessage');if(!el){el=document.createElement('div');el.id='saveMessage';el.className='save-toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=message;el.hidden=false;clearTimeout(showSaveMessage.timer);showSaveMessage.timer=setTimeout(()=>{el.hidden=true},3500)}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}function exportAll(kind){if(kind==='json'){download('value-ledger-lite.json',JSON.stringify(state,null,2),'application/json');return}let blocks=[['initiatives',state.initiatives],['benefits',state.benefits],['tracking',state.tracking],['costs',state.costs]];blocks.forEach(([name,items])=>{let keys=[...new Set(items.flatMap(x=>Object.keys(x)))];download('value-ledger-lite-'+name+'.csv',csv([keys,...items.map(x=>keys.map(k=>x[k]))]),'text/csv;charset=utf-8')})}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.benefitPage){benefitPage+=b.dataset.benefitPage==='next'?1:-1;render()}if(b.dataset.add)openModal(b.dataset.add);if(b.dataset.entries)openEntries(b.dataset.entries);if(b.dataset.addFor){openModal('tracking');let el=$('form').querySelector('[name=benefit]');if(el)el.value=b.dataset.addFor;}if(b.dataset.edit){let [kind,id]=b.dataset.edit.split(':');openModal(kind,id)}if(b.dataset.delete){let [kind,id]=b.dataset.delete.split(':');if(kind==='initiative'&&state.benefits.some(x=>x.initiative===id)){alert('Reassign or delete linked benefits first.');return}if(kind==='benefit'&&state.tracking.some(x=>x.benefit===id)){alert('Delete linked monthly tracking entries first.');return}if(confirm('Delete this record?')){let entriesParent=modalKind==='entries'?editing:null;let key={initiative:'initiatives',benefit:'benefits',tracking:'tracking',cost:'costs'}[kind];state[key]=state[key].filter(x=>x.id!==id);save();render();if(entriesParent&&kind==='tracking')openEntries(entriesParent)}}if(b.dataset.export)exportAll(b.dataset.export)});$('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:editing||uid()};for(let [k,v] of f)obj[k]=['budget','baseline','target','planned','actual','amount'].includes(k)?Number(v):String(v).trim();let key={initiative:'initiatives',benefit:'benefits',tracking:'tracking',cost:'costs'}[modalKind];if(modalKind==='tracking'&&state.tracking.some(x=>x.id!==obj.id&&x.benefit===obj.benefit&&x.month===obj.month)){alert('This benefit already has a result for that month. Edit it instead.');return}if(modalKind==='cost'&&state.costs.some(x=>x.id!==obj.id&&x.month===obj.month)){alert('This month already has a cost entry. Edit it instead.');return}let idx=state[key].findIndex(x=>x.id===obj.id);if(idx>=0)state[key][idx]=obj;else state[key].push(obj);let persisted=save();closeModal();render();showSaveMessage(persisted?'Saved successfully':'Saved for this session. Browser storage is unavailable; export JSON to keep your data.')};$('closeModal').onclick=closeModal;$('modalbg').onclick=e=>{if(e.target===$('modalbg'))closeModal()};$('currency').onchange=e=>{state.currency=e.target.value;save();render()};$('loadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!valid(data))throw Error('Missing required registers');if(confirm('Replace all current data with this JSON file?')){state=data;normalizeTypes();save();render()}}catch(err){alert('Could not load file: '+err.message)}e.target.value=''};if(!localStorage.getItem(KEY)){try{let old=JSON.parse(localStorage.getItem('value-ledger-lite-v1'));if(valid(old)){state=old;normalizeTypes()}}catch(e){}}render();save();
</script></body></html>
